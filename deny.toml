[graph]
all-features = true
[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
[licenses.private]
ignore = false
[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no vulnerability; replacing it changes the public API and local-time results (see comment)" },
]
