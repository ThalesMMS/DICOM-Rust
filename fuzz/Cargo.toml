[package]
name = "dicom-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
description = "Fuzz targets: every path that reads untrusted bytes (file and data set readers, deferred and frame readers, transfer syntax probe, PDU parser, DICOMDIR, DICOM JSON and XML, DICOMweb responses, vendor headers, encapsulated Pixel Data planner, each codec) and the decode guard. Run with cargo-fuzz (nightly): cargo +nightly fuzz run <target>; or, without libFuzzer, with the pure-Rust runner: cargo run --release -p dicom-rust-fuzz-harness --bin soak -- --target all."
[package.metadata]
cargo-fuzz = true
[workspace]
members = [".", "harness", "sancov-sections"]
[dependencies]
libfuzzer-sys = "0.4"
dicom-rust = { path = "..", default-features = false, features = ["net", "dicomweb", "codecs"] }
dicom-rust-fuzz-harness = { path = "harness" }
[[bin]]
name = "jpeg_header"
path = "fuzz_targets/jpeg_header.rs"
test = false
doc = false
bench = false
